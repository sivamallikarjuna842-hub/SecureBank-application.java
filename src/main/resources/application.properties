spring.application.name=Banking Management System

# H2 Database (dev)
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=THIS_IS_A_256_BIT_SECRET_KEY_FOR_JWT_TOKEN_GENERATION_EXAMPLE
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# Authentication policy
app.auth.require-mfa=false
app.auth.reset-link-base=http://localhost:3001/reset-password?token=

# Email (stub: log-only by default)
app.email.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CSRF (token in cookie for non-API endpoints if needed)
app.csrf.enabled=false

# Account defaults
app.account.savings-min-balance=500.00
app.account.current-min-balance=1000.00

# Loan defaults
app.loan.max-amount=1000000.00
app.loan.interest-rate=10.5
app.loan.max-tenure-months=60

# FD defaults
app.fd.min-amount=10000.00
app.fd.interest-rate-1yr=6.5
app.fd.interest-rate-3yr=7.0
app.fd.interest-rate-5yr=7.5

# Fraud detection
app.fraud.max-daily-transactions=10
app.fraud.max-daily-amount=50000.00
app.fraud.max-failed-login-attempts=3

# Server
server.port=8080
